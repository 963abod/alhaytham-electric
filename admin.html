<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | ورشة الهيثم للكهرباء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      font-family: 'Almarai', system-ui, sans-serif;
      color: #fff;
      background: #050505;
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body { background: #050505; }

    button, input { font: inherit; }

    .room {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 500px;
      display: flex;
      overflow: hidden;
      background: #050505;
      transition: background-color .8s ease;
    }

    .room.on { background: #111; }

    .room-light {
      position: absolute;
      top: -30%;
      right: 0;
      width: 1000px;
      height: 1000px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transform: scale(.5);
      background: radial-gradient(circle, rgba(255,220,100,.15) 0%, rgba(255,214,0,.05) 30%, transparent 70%);
      transition: opacity .8s ease, transform .8s ease;
    }

    .room.on .room-light { opacity: 1; transform: scale(1.5); }

    .fireflies {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    .firefly {
      position: absolute;
      border-radius: 50%;
      background: #FFEA00;
      box-shadow: 0 0 10px 3px rgba(255,234,0,.9), 0 0 20px rgba(255,179,0,.6);
      animation: fireflyMove var(--duration) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes fireflyMove {
      0% { transform: translate(var(--x1), var(--y1)); opacity: .45; }
      25% { transform: translate(var(--x2), var(--y2)); opacity: 1; }
      50% { transform: translate(var(--x3), var(--y3)); opacity: .65; }
      75% { transform: translate(var(--x4), var(--y4)); opacity: 1; }
      100% { transform: translate(var(--x5), var(--y5)); opacity: .5; }
    }

    .lamp-side {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .lamp-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      transform: scale(1.1);
      -webkit-tap-highlight-color: transparent;
    }

    .lamp-head {
      width: 140px;
      height: 50px;
      background: #151515;
      border-radius: 140px 140px 4px 4px;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.1), 0 10px 20px rgba(0,0,0,.9);
      position: relative;
      z-index: 6;
      transition: box-shadow .4s ease;
      border-bottom: 2px solid #050505;
    }

    .room.on .lamp-head {
      box-shadow: inset 0 -3px 10px rgba(255,220,150,.4), inset 0 2px 5px rgba(255,255,255,.1);
    }

    .lamp-glow {
      position: absolute;
      top: 40px;
      width: 90px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 40px 20px rgba(255,230,150,.9), 0 0 80px 40px rgba(255,200,100,.6);
      opacity: 0;
      transition: opacity .4s ease-in-out;
      z-index: 5;
      pointer-events: none;
    }

    .room.on .lamp-glow { opacity: 1; }

    .light-beam {
      position: absolute;
      top: 45px;
      width: 500px;
      height: 350px;
      clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
      background: linear-gradient(to bottom, rgba(255,230,140,.8) 0%, rgba(255,200,80,.2) 60%, transparent 100%);
      opacity: 0;
      transition: opacity .4s ease-in-out;
      z-index: 3;
      pointer-events: none;
      filter: blur(8px);
    }

    .room.on .light-beam { opacity: 1; }

    .lamp-stem {
      width: 6px;
      height: 290px;
      background: linear-gradient(to right, #050505 0%, #2a2a2a 50%, #050505 100%);
      position: relative;
      z-index: 4;
      transition: background .4s ease, box-shadow .4s ease;
    }

    .room.on .lamp-stem {
      background: linear-gradient(to right, #050505 0%, #2a2010 50%, #050505 100%);
      box-shadow: 0 0 10px rgba(255,200,100,.15);
    }

    .lamp-base {
      width: 100px;
      height: 16px;
      background: #151515;
      border-radius: 30px 30px 4px 4px;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.1), 0 10px 20px rgba(0,0,0,.9);
      position: relative;
      z-index: 5;
      transition: box-shadow .4s ease;
      border-bottom: 2px solid #050505;
    }

    .room.on .lamp-base {
      box-shadow: inset 0 2px 6px rgba(255,220,150,.3), 0 10px 20px rgba(0,0,0,.9);
    }

    .desk-surface {
      position: absolute;
      bottom: -40px;
      width: 550px;
      height: 100px;
      background: radial-gradient(ellipse at center, rgba(255,220,120,.25) 0%, rgba(255,180,50,.05) 50%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      transition: opacity .4s ease-in-out;
      z-index: 1;
      pointer-events: none;
    }

    .room.on .desk-surface { opacity: 1; }

    .string-svg {
      position: absolute;
      top: 45px;
      left: calc(50% + 55px);
      width: 2px;
      height: 2px;
      overflow: visible;
      z-index: 5;
      pointer-events: none;
    }

    .string-svg path {
      stroke: #222;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }

    .string-handle {
      position: absolute;
      top: 125px;
      left: calc(50% + 49px);
      width: 10px;
      height: 20px;
      background: linear-gradient(to bottom, #ebd17a, #aa8529);
      border-radius: 5px;
      box-shadow: inset 0 2px 3px rgba(255,255,255,.5), 0 3px 5px rgba(0,0,0,.7);
      cursor: grab;
      z-index: 6;
      touch-action: none;
      user-select: none;
      transition: transform .35s cubic-bezier(.2,.8,.2,1);
    }

    .string-handle.dragging { cursor: grabbing; transition: none; }

    .prompt {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 15px;
      font-weight: 500;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 1;
      transition: opacity .5s ease, transform .5s ease;
      white-space: nowrap;
    }

    .room.on .prompt { opacity: 0; transform: translate(-50%, -20px); }

    .prompt i {
      width: 2px;
      height: 35px;
      background: linear-gradient(to bottom, #777, transparent);
      animation: promptArrow 2s infinite;
    }

    @keyframes promptArrow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    .login-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding-left: 8%;
    }

    .login-card {
      padding: 44px 36px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-40px);
      filter: blur(10px);
      pointer-events: none;
      transition: opacity .6s ease .0s, transform .6s cubic-bezier(.2,.8,.2,1), filter .6s ease;
    }

    .room.on .login-card {
      opacity: 1;
      transform: translateX(0);
      filter: blur(0);
      pointer-events: auto;
      transition-delay: .2s;
    }

    .glass {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }

    .glass-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,220,100,.4), transparent);
    }

    .login-heading {
      text-align: center;
      margin-bottom: 6px;
    }

    .login-heading h2 {
      font-family: 'Tajawal', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fff;
    }

    .login-heading p { color: #a39a89; font-size: 14px; }

    .inputs { display: flex; flex-direction: column; gap: 16px; }

    .input-wrap { position: relative; display: block; }

    .input-wrap input {
      width: 100%;
      padding: 15px 46px 15px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.45);
      color: #fff;
      font-size: 14px;
      outline: none;
      direction: ltr;
      text-align: right;
      transition: border-color .3s, box-shadow .3s, background-color .3s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }

    .input-wrap input:focus {
      border-color: rgba(255,220,100,.5);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5), 0 0 0 3px rgba(255,220,100,.1);
    }

    .input-wrap input::placeholder { color: #777; text-align: right; }

    .input-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      z-index: 2;
      opacity: .75;
    }

    .mail-icon::before {
      content: '';
      position: absolute; inset: 3px 1px;
      border: 2px solid #aaa; border-radius: 3px;
    }
    .mail-icon::after {
      content: '';
      position: absolute;
      width: 9px; height: 9px;
      border-left: 2px solid #aaa; border-bottom: 2px solid #aaa;
      transform: rotate(-45deg);
      right: 5px; top: 1px;
    }

    .lock-icon::before {
      content: '';
      position: absolute;
      width: 12px; height: 10px;
      border: 2px solid #aaa; border-radius: 3px;
      right: 2px; bottom: 1px;
    }
    .lock-icon::after {
      content: '';
      position: absolute;
      width: 8px; height: 9px;
      border: 2px solid #aaa; border-bottom: 0;
      border-radius: 8px 8px 0 0;
      right: 4px; top: 0;
    }

    .sign-in {
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(180deg, #f2c94c, #c9a227);
      color: #0a0908;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: transform .2s, box-shadow .3s;
    }

    .sign-in:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(242,201,76,.4);
    }

    .sign-in:active { transform: translateY(0); }

    .login-status {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    @media (max-width: 900px) {
      .room { flex-direction: column; overflow-y: auto; }
      .lamp-side { flex: 0 0 50vh; min-height: 380px; }
      .login-side { padding: 20px 20px 40px; flex: 0 0 auto; }
      .login-card { max-width: 380px; transform: translateY(30px); }
      .room.on .login-card { transform: translateY(0); }
      .prompt { top: 6%; font-size: 13px; }
    }

    @media (max-height: 650px) and (min-width: 901px) {
      .lamp-container { transform: scale(.8); }
      .login-card { padding: 28px; gap: 14px; }
    }
  </style>
</head>
<body>

  <main class="room" id="room">
    <div class="room-light" id="roomLight"></div>
    <div class="fireflies" id="fireflies"></div>

    <section class="lamp-side">
      <div class="prompt">
        <span>اسحب الخيط للتشغيل</span>
        <i></i>
      </div>

      <div class="lamp-container" id="lampContainer">
        <div class="lamp-glow"></div>
        <div class="lamp-head"></div>
        <div class="light-beam"></div>
        <div class="lamp-stem"></div>
        <div class="lamp-base"></div>
        <div class="desk-surface"></div>

        <svg class="string-svg" aria-hidden="true">
          <path id="stringPath" d="M 0 0 L 0 80"></path>
        </svg>

        <div class="string-handle" id="stringHandle" aria-label="Pull lamp string"></div>
      </div>
    </section>

    <section class="login-side">
      <form class="glass login-card" id="loginForm">
        <div class="glass-line"></div>

        <div class="login-heading">
          <h2>لوحة التحكم</h2>
          <p>ورشة الهيثم للكهرباء والطاقة الشمسية</p>
        </div>

        <div class="inputs">
          <label class="input-wrap">
            <span class="input-icon mail-icon" aria-hidden="true"></span>
            <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
          </label>

          <label class="input-wrap">
            <span class="input-icon lock-icon" aria-hidden="true"></span>
            <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
          </label>
        </div>

        <button class="sign-in" type="submit" id="btnSubmit">تسجيل الدخول</button>

        <div class="login-status" id="loginStatus"></div>
      </form>
    </section>
  </main>

  <script>
    const room = document.getElementById('room');
    const handle = document.getElementById('stringHandle');
    const path = document.getElementById('stringPath');
    const fireflies = document.getElementById('fireflies');
    const loginForm = document.getElementById('loginForm');

    let isOn = false;
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let dragX = 0;
    let dragY = 0;

    function setLamp(on) {
      isOn = on;
      room.classList.toggle('on', isOn);
      if (isOn) createFireflies();
      else fireflies.innerHTML = '';
    }

    function updateString(x, y) {
      path.setAttribute('d', `M 0 0 L ${x} ${80 + y}`);
    }

    function resetHandle() {
      handle.style.transform = 'translate(0px, 0px)';
      updateString(0, 0);
    }

    function pointerDown(e) {
      dragging = true;
      handle.classList.add('dragging');
      startX = e.clientX;
      startY = e.clientY;
      dragX = 0;
      dragY = 0;
      handle.setPointerCapture?.(e.pointerId);
    }

    function pointerMove(e) {
      if (!dragging) return;
      dragX = (e.clientX - startX) * 0.3;
      dragY = Math.max(0, e.clientY - startY) * 0.6;
      dragX = Math.max(-35, Math.min(35, dragX));
      dragY = Math.min(180, dragY);
      handle.style.transform = `translate(${dragX}px, ${dragY}px)`;
      updateString(dragX, dragY);
    }

    function pointerUp() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');

      const pulled = dragY > 30;
      resetHandle();

      if (pulled) setLamp(!isOn);
    }

    handle.addEventListener('pointerdown', pointerDown);
    handle.addEventListener('pointermove', pointerMove);
    handle.addEventListener('pointerup', pointerUp);
    handle.addEventListener('pointercancel', pointerUp);

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createFireflies() {
      fireflies.innerHTML = '';

      for (let i = 0; i < 18; i++) {
        const dot = document.createElement('span');
        dot.className = 'firefly';

        const size = random(3, 7);
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.setProperty('--duration', `${random(35, 65)}s`);
        dot.style.setProperty('--delay', `${random(0, 3)}s`);

        for (let n = 1; n <= 5; n++) {
          dot.style.setProperty(`--x${n}`, `${random(0, 100)}vw`);
          dot.style.setProperty(`--y${n}`, `${random(0, 100)}vh`);
        }

        fireflies.appendChild(dot);
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
    });

    setLamp(false);
  </script>
</body>
  </html>
