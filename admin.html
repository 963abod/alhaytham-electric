<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | ورشة الهيثم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=Almarai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0908; --bg-1:#141210; --bg-2:#1c1916;
    --gold:#c9a227; --gold-bright:#f2c94c;
    --ink:#f4efe4; --ink-muted:#a39a89; --line:rgba(201,162,39,.2);
    --ok:#4caf6d; --err:#e2584d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-0);color:var(--ink);font-family:'Almarai',system-ui,sans-serif;}
  h1,h2,.brand{font-family:'Tajawal',sans-serif;}
  input,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:8px;font-family:inherit;font-size:.92rem;margin-top:4px;}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:.82rem;color:var(--ink-muted);display:block;margin-top:12px;}
  button{cursor:pointer;font-family:inherit;font-weight:700;border:none;border-radius:999px;padding:10px 22px;font-size:.88rem;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--bg-0);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);}
  .msg{font-size:.85rem;margin-top:10px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}

  /* login screen */
  #login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;padding:32px 26px;text-align:center;}
  .login-box h1{font-size:1.3rem;margin:0 0 6px;}
  .login-box p{color:var(--ink-muted);font-size:.85rem;margin:0 0 20px;}
  .login-box button{width:100%;margin-top:18px;}

  /* dashboard */
  #dash-view{display:none;}
  header{position:sticky;top:0;background:rgba(10,9,8,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
  header .brand{font-weight:800;font-size:1rem;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 0;}
  .tab{flex:none;background:var(--bg-1);border:1px solid var(--line);color:var(--ink-muted);padding:9px 18px;border-radius:999px;font-size:.85rem;font-weight:700;}
  .tab.active{background:var(--gold-dim,rgba(201,162,39,.18));color:var(--gold-bright);border-color:var(--gold);}
  .panel{display:none;padding:20px 18px 60px;max-width:640px;margin:0 auto;}
  .panel.active{display:block;}
  .card{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-head h3{margin:0;font-size:.98rem;}
  .row-actions{display:flex;gap:8px;margin-top:12px;}
  .add-box{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:22px;}
  .add-box h3{margin:0 0 4px;font-size:.95rem;color:var(--gold-bright);}
  small.hint{color:var(--ink-muted);display:block;margin-top:4px;font-size:.75rem;}
  .cat-heading{color:var(--gold-bright);font-size:.9rem;font-weight:800;margin:22px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .cat-heading:first-child{margin-top:0;}
  .item-row{display:flex;gap:12px;align-items:center;}
  .item-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg-2);flex:none;border:1px solid var(--line);}
  .item-info{flex:1;min-width:0;}
  .item-info h3{font-size:.92rem;margin:0;}
  .item-info p{margin:2px 0 0;font-size:.78rem;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-box">
    <h1>لوحة تحكم ورشة الهيثم</h1>
    <p>سجّل دخولك لإدارة محتوى الموقع</p>
    <label>البريد الإلكتروني</label>
    <input type="email" id="login-email">
    <label>كلمة المرور</label>
    <input type="password" id="login-pass">
    <button class="btn-gold" onclick="doLogin()">تسجيل الدخول</button>
    <div class="msg err" id="login-msg"></div>
  </div>
</div>

<div id="dash-view">
  <header>
    <span class="brand">لوحة التحكم</span>
    <button class="btn-outline" onclick="doLogout()">تسجيل الخروج</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="settings">معلومات الموقع</button>
    <button class="tab" data-tab="services">الخدمات</button>
    <button class="tab" data-tab="products">المنتجات</button>
    <button class="tab" data-tab="gallery">أعمالنا</button>
  </div>

  <!-- SETTINGS -->
  <div class="panel active" id="panel-settings">
    <div class="card">
      <label>اسم الورشة</label><input id="set-name">
      <label>العنوان الرئيسي (Hero)</label><input id="set-tagline">
      <label>وصف مختصر</label><textarea id="set-desc"></textarea>
      <label>نص "من نحن"</label><textarea id="set-about"></textarea>
      <label>رقم الهاتف</label><input id="set-phone" placeholder="0982506890">
      <label>رقم واتساب (نفس الرقم عادة)</label><input id="set-whatsapp" placeholder="0982506890">
      <label>نقاط "لماذا ورشة الهيثم؟" (سطر لكل نقطة)</label><textarea id="set-why"></textarea>
      <div class="row-actions"><button class="btn-gold" onclick="saveSettings()">حفظ التعديلات</button></div>
      <div class="msg" id="settings-msg"></div>
    </div>
  </div>

  <!-- SERVICES -->
  <div class="panel" id="panel-services">
    <div id="services-list"></div>
    <div class="add-box">
      <h3>+ إضافة خدمة جديدة</h3>
      <label>العنوان</label><input id="new-service-title">
      <label>الوصف</label><textarea id="new-service-desc"></textarea>
      <label>الأيقونة</label>
      <input id="new-service-icon" placeholder="fault / panel / solar / maintain / battery">
      <small class="hint">اختياري - اترك فاضي لأيقونة افتراضية</small>
      <div class="row-actions"><button class="btn-gold" onclick="addService()">إضافة</button></div>
      <div class="msg" id="services-msg"></div>
    </div>
  </div>

  <!-- PRODUCTS -->
  <div class="panel" id="panel-products">
    <div id="products-list"></div>
    <div class="add-box">
      <h3>+ إضافة منتج جديد</h3>
      <label>النوع/الفئة (مثلاً: إنفرترات، ألواح شمسية...)</label>
      <input id="new-product-category" list="cat-list" placeholder="اكتبي نوع موجود أو نوع جديد">
      <datalist id="cat-list"></datalist>
      <label>اسم المنتج</label><input id="new-product-name">
      <label>الوصف</label><textarea id="new-product-desc"></textarea>
      <label>صورة المنتج</label><input type="file" id="new-product-file" accept="image/*">
      <div class="row-actions"><button class="btn-gold" onclick="addProduct()">إضافة</button></div>
      <div class="msg" id="products-msg"></div>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="panel" id="panel-gallery">
    <div id="gallery-list"></div>
    <div class="add-box">
      <h3>+ إضافة صورة عمل</h3>
      <label>وصف الصورة (اختياري)</label><input id="new-gallery-caption">
      <label>الصورة</label><input type="file" id="new-gallery-file" accept="image/*">
      <div class="row-actions"><button class="btn-gold" onclick="addGalleryItem()">إضافة</button></div>
      <div class="msg" id="gallery-msg"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://eftlniajfnvvzmxswgtj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_6ypXec8dblC0ZHq7ERXUuw_TzXAZTnu';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  window.supabase = supabase;

  function showMsg(id, text, ok){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + (ok?'ok':'err');
  }

  // ---------- AUTH ----------
  window.doLogin = async function(){
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){ showMsg('login-msg', 'خطأ: بيانات الدخول غير صحيحة', false); return; }
    enterDashboard();
  };
  window.doLogout = async function(){
    await supabase.auth.signOut();
    location.reload();
  };
  async function checkSession(){
    const { data } = await supabase.auth.getSession();
    if(data.session) enterDashboard();
  }
  function enterDashboard(){
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('dash-view').style.display = 'block';
    loadSettings(); loadServices(); loadProducts(); loadGallery();
  }
  checkSession();

  // ---------- TABS ----------
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- SETTINGS ----------
  async function loadSettings(){
    const { data } = await supabase.from('site_settings').select('*').eq('id',1).single();
    if(!data) return;
    document.getElementById('set-name').value = data.workshop_name||'';
    document.getElementById('set-tagline').value = data.tagline||'';
    document.getElementById('set-desc').value = data.description||'';
    document.getElementById('set-about').value = data.about_text||'';
    document.getElementById('set-phone').value = data.phone||'';
    document.getElementById('set-whatsapp').value = data.whatsapp||'';
    document.getElementById('set-why').value = (data.why_us||[]).join('\n');
  }
  window.saveSettings = async function(){
    const why_us = document.getElementById('set-why').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const { error } = await supabase.from('site_settings').update({
      workshop_name: document.getElementById('set-name').value,
      tagline: document.getElementById('set-tagline').value,
      description: document.getElementById('set-desc').value,
      about_text: document.getElementById('set-about').value,
      phone: document.getElementById('set-phone').value,
      whatsapp: document.getElementById('set-whatsapp').value,
      why_us
    }).eq('id',1);
    showMsg('settings-msg', error ? 'صار خطأ، حاول مرة ثانية' : 'تم الحفظ بنجاح', !error);
  };

  // ---------- SERVICES ----------
  async function loadServices(){
    const { data } = await supabase.from('services').select('*').order('sort_order');
    const list = document.getElementById('services-list');
    list.innerHTML = '';
    (data||[]).forEach(s=>{
      const div = document.createElement('div');
      div.className='card';
      div.innerHTML = `<div class="card-head"><h3>${s.title}</h3></div><p style="color:var(--ink-muted);font-size:.85rem;margin:6px 0 0;">${s.description||''}</p>
        <div class="row-actions"><button class="btn-danger" data-id="${s.id}">حذف</button></div>`;
      div.querySelector('.btn-danger').onclick = async ()=>{
        await supabase.from('services').delete().eq('id', s.id);
        loadServices();
      };
      list.appendChild(div);
    });
  }
  window.addService = async function(){
    const title = document.getElementById('new-service-title').value.trim();
    if(!title){ showMsg('services-msg','لازم تكتب عنوان الخدمة', false); return; }
    const { error } = await supabase.from('services').insert({
      title,
      description: document.getElementById('new-service-desc').value,
      icon: document.getElementById('new-service-icon').value.trim() || 'default',
      sort_order: Date.now()
    });
    if(error){ showMsg('services-msg','صار خطأ، حاول مرة ثانية', false); return; }
    document.getElementById('new-service-title').value='';
    document.getElementById('new-service-desc').value='';
    document.getElementById('new-service-icon').value='';
    showMsg('services-msg','تمت الإضافة', true);
    loadServices();
  };

  // ---------- PRODUCTS ----------
  async function loadProducts(){
    const { data } = await supabase.from('products').select('*').order('category').order('sort_order');
    const list = document.getElementById('products-list');
    list.innerHTML = '';
    const cats = [...new Set((data||[]).map(p=>p.category||'عام'))];
    document.getElementById('cat-list').innerHTML = cats.map(c=>`<option value="${c}">`).join('');

    let lastCat = null;
    (data||[]).forEach(p=>{
      const cat = p.category || 'عام';
      if(cat !== lastCat){
        const h = document.createElement('div');
        h.className='cat-heading';
        h.textContent = cat;
        list.appendChild(h);
        lastCat = cat;
      }
      const div = document.createElement('div');
      div.className='card';
      const thumb = p.image_url ? `<img class="item-thumb" src="${p.image_url}">` : `<div class="item-thumb"></div>`;
      div.innerHTML = `<div class="item-row">${thumb}<div class="item-info"><h3>${p.name}</h3><p>${p.description||''}</p></div></div>
        <div class="row-actions"><button class="btn-danger" data-id="${p.id}">حذف</button></div>`;
      div.querySelector('.btn-danger').onclick = async ()=>{
        await supabase.from('products').delete().eq('id', p.id);
        loadProducts();
      };
      list.appendChild(div);
    });
  }
  window.addProduct = async function(){
    const name = document.getElementById('new-product-name').value.trim();
    if(!name){ showMsg('products-msg','لازم تكتب اسم المنتج', false); return; }
    let image_url = '';
    const file = document.getElementById('new-product-file').files[0];
    if(file){
      const path = `products/${Date.now()}_${file.name}`;
      const { error: upErr } = await supabase.storage.from('images').upload(path, file);
      if(upErr){ showMsg('products-msg','خطأ برفع الصورة: '+upErr.message, false); return; }
      image_url = supabase.storage.from('images').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await supabase.from('products').insert({
      name, description: document.getElementById('new-product-desc').value,
      category: document.getElementById('new-product-category').value.trim() || 'عام',
      image_url, sort_order: Date.now()
    });
    if(error){ showMsg('products-msg','خطأ: '+error.message, false); return; }
    document.getElementById('new-product-name').value='';
    document.getElementById('new-product-desc').value='';
    document.getElementById('new-product-file').value='';
    showMsg('products-msg','تمت الإضافة', true);
    loadProducts();
  };

  // ---------- GALLERY ----------
  async function loadGallery(){
    const { data } = await supabase.from('gallery').select('*').order('sort_order');
    const list = document.getElementById('gallery-list');
    list.innerHTML = '';
    (data||[]).forEach(g=>{
      const div = document.createElement('div');
      div.className='card';
      div.innerHTML = `<div class="item-row"><img class="item-thumb" src="${g.image_url}"><div class="item-info"><h3>${g.caption||'بدون وصف'}</h3></div></div>
        <div class="row-actions"><button class="btn-danger" data-id="${g.id}">حذف</button></div>`;
      div.querySelector('.btn-danger').onclick = async ()=>{
        await supabase.from('gallery').delete().eq('id', g.id);
        loadGallery();
      };
      list.appendChild(div);
    });
  }
  window.addGalleryItem = async function(){
    const file = document.getElementById('new-gallery-file').files[0];
    if(!file){ showMsg('gallery-msg','لازم تختار صورة', false); return; }
    const path = `gallery/${Date.now()}_${file.name}`;
    const { error: upErr } = await supabase.storage.from('images').upload(path, file);
    if(upErr){ showMsg('gallery-msg','خطأ برفع الصورة: '+upErr.message, false); return; }
    const image_url = supabase.storage.from('images').getPublicUrl(path).data.publicUrl;
    const { error } = await supabase.from('gallery').insert({
      image_url, caption: document.getElementById('new-gallery-caption').value, sort_order: Date.now()
    });
    if(error){ showMsg('gallery-msg','خطأ: '+error.message, false); return; }
    document.getElementById('new-gallery-caption').value='';
    document.getElementById('new-gallery-file').value='';
    showMsg('gallery-msg','تمت الإضافة', true);
    loadGallery();
  };
</script>

</body>
</html>
